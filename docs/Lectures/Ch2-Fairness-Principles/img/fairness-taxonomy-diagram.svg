<svg viewBox="0 0 1520 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1520" height="520" fill="#ffffff"/>

  <!-- Connectors -->
  <g stroke="#1F4E79" stroke-width="2" fill="none">
    <!-- Root to level 2 -->
    <line x1="715" y1="100" x2="715" y2="150"/>
    <line x1="350" y1="150" x2="1080" y2="150"/>
    <line x1="350" y1="150" x2="350" y2="210"/>
    <line x1="1080" y1="150" x2="1080" y2="210"/>

    <!-- Individual fairness to its three children -->
    <line x1="350" y1="280" x2="350" y2="320"/>
    <line x1="140" y1="320" x2="560" y2="320"/>
    <line x1="140" y1="320" x2="140" y2="360"/>
    <line x1="350" y1="320" x2="350" y2="360"/>
    <line x1="560" y1="320" x2="560" y2="360"/>

    <!-- Group fairness to its four children -->
    <line x1="1080" y1="280" x2="1080" y2="320"/>
    <line x1="787.5" y1="320" x2="1372.5" y2="320"/>
    <line x1="787.5" y1="320" x2="787.5" y2="360"/>
    <line x1="982.5" y1="320" x2="982.5" y2="360"/>
    <line x1="1177.5" y1="320" x2="1177.5" y2="360"/>
    <line x1="1372.5" y1="320" x2="1372.5" y2="360"/>
  </g>

  <!-- Root -->
  <rect x="635" y="30" width="160" height="70" rx="6" fill="#1F4E79"/>
  <text x="715" y="72" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Fairness</text>

  <!-- Level 2 -->
  <rect x="220" y="210" width="260" height="70" rx="6" fill="#1F4E79"/>
  <text x="350" y="252" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Individual Fairness</text>

  <rect x="950" y="210" width="260" height="70" rx="6" fill="#1F4E79"/>
  <text x="1080" y="252" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Group Fairness</text>

  <!-- Level 3: Individual fairness children -->
  <rect x="45" y="360" width="190" height="110" rx="6" fill="#1F4E79"/>
  <text x="140" y="405" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">
    <tspan x="140" dy="0">Fairness through</tspan>
    <tspan x="140" dy="24">Unawareness</tspan>
    <tspan x="140" dy="24">(FTU)</tspan>
  </text>

  <rect x="255" y="360" width="190" height="110" rx="6" fill="#1F4E79"/>
  <text x="350" y="417" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">
    <tspan x="350" dy="0">Fairness through</tspan>
    <tspan x="350" dy="24">Awareness</tspan>
  </text>

  <rect x="465" y="360" width="190" height="110" rx="6" fill="#1F4E79"/>
  <text x="560" y="405" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">
    <tspan x="560" dy="0">Controlling for the</tspan>
    <tspan x="560" dy="24">Protected Variable</tspan>
    <tspan x="560" dy="24">(CPV)</tspan>
  </text>

  <!-- Level 3: Group fairness children -->
  <rect x="700" y="360" width="175" height="110" rx="6" fill="#1F4E79"/>
  <text x="787.5" y="417" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">
    <tspan x="787.5" dy="0">Demographic Parity</tspan>
    <tspan x="787.5" dy="24">(DP)</tspan>
  </text>

  <rect x="895" y="360" width="175" height="110" rx="6" fill="#1F4E79"/>
  <text x="982.5" y="405" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">
    <tspan x="982.5" dy="0">Conditional</tspan>
    <tspan x="982.5" dy="22">Demographic Parity</tspan>
    <tspan x="982.5" dy="22">(CDP)</tspan>
  </text>

  <rect x="1090" y="360" width="175" height="110" rx="6" fill="#1F4E79"/>
  <text x="1177.5" y="422" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Separation</text>

  <rect x="1285" y="360" width="175" height="110" rx="6" fill="#1F4E79"/>
  <text x="1372.5" y="422" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Sufficiency</text>
</svg>
